<style id="css">
body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
.halo {
  position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
  width: 68px; height: 20px; border: 3px solid #0EA5E9; border-radius: 50%;
  box-shadow: 0 0 15px #0EA5E9, inset 0 0 8px #0284C7;
  animation: hp 2.6s ease-in-out infinite;
}
@keyframes hp { 50% { opacity: .6; transform: translateX(-50%) translateY(-2px) scale(1.06); } }
.sb::-webkit-scrollbar { display: none; }
.sb { scrollbar-width: none; }
.chip {
  color: #0f172a; background: linear-gradient(145deg, #ffffff, #f1f5f9);
  box-shadow: 3px 3px 8px rgba(15, 23, 42, .07), -3px -3px 8px #ffffff;
  transition: .3s cubic-bezier(.34, 1.56, .64, 1);
}
.dark .chip {
  color: #f8fafc; background: linear-gradient(145deg, #1e293b, #0f172a);
  box-shadow: 3px 3px 10px rgba(0, 0, 0, .5), -2px -2px 6px rgba(255, 255, 255, .03);
}
.chip:hover { transform: translateY(-3px) scale(1.03); }
.chip.on {
  color: #fff; background: linear-gradient(135deg, #0284C7, #0369A1) !important;
  box-shadow: 0 8px 20px -4px rgba(14, 165, 233, .5);
}
.chip.on i { color: #fff !important; }
.sk { background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%); background-size: 200% 100%; animation: sh 1.2s infinite; }
.dark .sk { background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%); background-size: 200% 100%; }
@keyframes sh { to { background-position: -200% 0; } }
.drawer { transition: transform .35s cubic-bezier(.32, .72, 0, 1); }
@keyframes td { from { transform: translateY(-100%); opacity: 0; } }
.toast { animation: td .3s ease-out; }
.card { transition: transform .3s, box-shadow .3s; }
.card:hover { transform: translateY(-4px); box-shadow: 0 14px 30px -10px rgba(14, 165, 233, .28); }
#gc { touch-action: manipulation; display: block; }
.ic { width: 1.15em; height: 1.15em; display: inline-block; vertical-align: -.2em; flex-shrink: 0; }
:focus-visible { outline: 2px solid #0EA5E9; outline-offset: 2px; }
@keyframes eqPulse { 0%, 100% { height: 4px; } 50% { height: 14px; } }
.eq-bar { width: 2.5px; background: #0EA5E9; border-radius: 2px; animation: eqPulse 1.1s ease-in-out infinite; }
.eq-paused .eq-bar { animation: none; height: 4px !important; opacity: 0.45; }
@media(prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.hero-h{height:50px;width:auto}
@media(min-width:640px){.hero-h{height:72px}}
#splash{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(circle at 50% 40%,#0b2a5b,#050b1a 70%);color:#fff;transition:opacity .6s;cursor:pointer}
#splash.out{opacity:0;pointer-events:none}
.sp-img{width:min(72vw,300px)}
.sp-bar{width:min(60vw,220px);height:5px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden}
.sp-bar i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#10B981);animation:ld 2.7s ease-out forwards}
@keyframes ld{from{width:0}to{width:100%}}
.card{animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.95)}}
.card img,.card .svc-ic{animation:pf 4.5s ease-in-out infinite;animation-delay:calc(var(--i,0)*-.7s)}
@keyframes pf{50%{transform:scale(1.07)}}
</style>
</head>

/* --- Calm Ambient Guitar & Pad Music Engine (Web Audio API) --- */
const Music = {
  ctx: null, master: null, playing: false, timer: null, step: 0, vol: 0.16, customEl: null,
  // Warm Latin-inspired calm romantic chord progression (Am - Dm - G - C - F - Dm - E7 - Am)
  chords: [
    [220.00, 261.63, 329.63, 440.00], // Am
    [146.83, 220.00, 293.66, 349.23], // Dm
    [196.00, 246.94, 293.66, 392.00], // G
    [130.81, 196.00, 261.63, 329.63], // C
    [174.61, 220.00, 261.63, 349.23], // F
    [146.83, 174.61, 220.00, 293.66], // Dm
    [164.81, 207.65, 246.94, 329.63], // E
    [220.00, 261.63, 329.63, 440.00]  // Am
  ],
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.vol;
    this.master.connect(this.ctx.destination);
  },
  pluck(freq, dur = 2.4, gainAmt = 0.25) {
    if (!this.ctx || !this.playing) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const sub = this.ctx.createOscillator();
    const filter = this.ctx.createBiquadFilter();
    const gain = this.ctx.createGain();

    // Soft nylon acoustic guitar warmth
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, now);
    sub.type = 'sine';
    sub.frequency.setValueAtTime(freq * 2, now);

    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(950, now);
    filter.frequency.exponentialRampToValueAtTime(320, now + dur);

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(gainAmt, now + 0.04);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

    const subGain = this.ctx.createGain();
    subGain.gain.value = 0.08;

    osc.connect(filter);
    sub.connect(subGain);
    subGain.connect(filter);
    filter.connect(gain);
    gain.connect(this.master);

    osc.start(now);
    sub.start(now);
    osc.stop(now + dur + 0.05);
    sub.stop(now + dur + 0.05);
  },
  start() {
    if (this.customEl) {
      this.customEl.volume = Math.min(1, this.vol * 2);
      this.customEl.play().catch(() => {});
      this.playing = true;
      this.updateUI();
      return;
    }
    this.init();
    if (!this.ctx) return;
    if (this.ctx.state === 'suspended') this.ctx.resume();
    if (this.playing) return;
    this.playing = true;
    this.updateUI();
    const pattern = [0, 1, 2, 3, 2, 1];
    const tick = () => {
      if (!this.playing) return;
      const chordIdx = Math.floor(this.step / 6) % this.chords.length;
      const noteIdx = pattern[this.step % 6];
      const freq = this.chords[chordIdx][noteIdx];
      this.pluck(freq, noteIdx === 0 ? 3.2 : 2.1, noteIdx === 0 ? 0.32 : 0.2);
      this.step++;
    };
    tick();
    this.timer = setInterval(tick, 540); // Calm slow tempo (~110 eighth notes/min)
  },
  stop() {
    this.playing = false;
    clearInterval(this.timer);
    if (this.customEl) this.customEl.pause();
    this.updateUI();
  },
  updateUI() {
    const eq = $('eqAnim');
    if (eq) eq.classList.toggle('eq-paused', !this.playing);
  }
};

function setMusicVol(v) {
  Music.vol = parseFloat(v);
  if ($('musicVol')) $('musicVol').value = v;
  if (Music.master && Music.ctx) Music.master.gain.setTargetAtTime(Music.vol, Music.ctx.currentTime, 0.05);
  if (Music.customEl) Music.customEl.volume = Math.min(1, Music.vol * 2);
}
async function loadCustomAudio(e) {
  const f = e.target.files[0]; if (!f) return;
  if (f.size > 8e6) return toast('الملف كبير (الحد 8MB)', 'error');
  let url;
  if (CL.AS) { try { url = (await CL.AS.upload(f)).url; } catch { return toast('تعذر رفع الأغنية', 'error'); } }
  else url = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); });
  Music.stop(); Music.customEl = new Audio(url); Music.customEl.loop = true; Music.start();
  document.querySelectorAll('.rsb').forEach(b => b.classList.remove('hidden'));
  S.song = url; if (CL.AS) cloudPush(); else saveDraft();
  toast('تم تثبيت الأغنية');
}

  Music.stop();

}
